name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'  # Every Monday at 03:00 UTC
  # The deep scans below skip pull requests; this allows running them on a
  # branch, e.g. to verify a change to this workflow before merging.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Fast checks: run on every PR and push ────────────────────────────────
  npm-audit:
    name: npm Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run npm audit
        run: |
          npm audit --audit-level=high
        continue-on-error: true  # advisory only; fails the PR visibly

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: true

  # ── Deep scans: CodeQL and Snyk, only on main push or schedule ───────────
  codeql:
    name: CodeQL Analysis
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript, typescript
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"

  trivy:
    name: Trivy Filesystem Scan
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      security-events: write

    steps:
      - uses: actions/checkout@v4

      # Pinned to a commit: in March 2026 the trivy-action tags up to 0.34.2
      # were hijacked (GHSA-69fq-xp46-6x23) and the unprefixed tags deleted.
      # ed142fd = v0.36.0, a descendant of the verified safe v0.35.0 (57a97c7).
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          # .opencode holds local tooling of the OpenCode coding agent; it is
          # not part of the application or the published client package.
          skip-dirs: 'node_modules,client/node_modules,.git,.opencode'

      # Findings are uploaded to the Security tab; also show them as
      # annotations on the run so they are visible without that access.
      - name: Annotate Trivy findings
        if: always() && hashFiles('trivy-results.sarif') != ''
        run: |
          jq -r '.runs[].results[]
            | "::error file=\(.locations[0].physicalLocation.artifactLocation.uri)::\(.ruleId): \(.message.text | split("\n")[0])"' \
            trivy-results.sarif | head -n 40

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy'

  snyk:
    name: Snyk Security Scan
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Check Snyk token availability
        id: snyk_token
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -n "$SNYK_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.snyk_token.outputs.available == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        if: steps.snyk_token.outputs.available == 'true'
        run: npm ci

      - name: Run Snyk to check for vulnerabilities
        if: steps.snyk_token.outputs.available == 'true'
        uses: snyk/actions/node@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: >-
            --severity-threshold=high
            --fail-on=all
            --json-file-output=snyk-results.json

      - name: Upload Snyk results
        if: always() && steps.snyk_token.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: snyk-results
          path: snyk-results.json
          retention-days: 30

      - name: Skip Snyk (no token configured)
        if: steps.snyk_token.outputs.available != 'true'
        run: echo "SNYK_TOKEN is not configured; skipping Snyk scan."
