name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'  # Every Monday at 03:00 UTC
  # The deep scans below skip pull requests; this allows running them on a
  # branch, e.g. to verify a change to this workflow before merging.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Fast checks: run on every PR and push ────────────────────────────────
  npm-audit:
    name: npm Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run npm audit
        run: |
          npm audit --audit-level=high
        continue-on-error: true  # advisory only; fails the PR visibly

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: true

  # OSV-Scanner (https://github.com/google/osv-scanner) scans only the
  # lockfiles against the OSV database, needs no token and is fast enough to
  # run on every event, complementing npm audit / Trivy / Snyk.
  osv-scanner:
    name: OSV-Scanner (OSV.dev)
    runs-on: ubuntu-latest
    permissions:
      security-events: write

    steps:
      - uses: actions/checkout@v7

      # Pinned to a commit like the other third-party actions in this file.
      # Scans both lockfiles (middleware root + client library). Exits 1 when
      # vulnerabilities are found, hence continue-on-error; the report step
      # below decides the job outcome.
      - name: Run OSV-Scanner
        id: scan
        uses: google/osv-scanner-action/osv-scanner-action@d3c1414ded37de590f207572e37a7d180f1d0ef7 # v2.7.1
        env:
          GOTOOLCHAIN: auto
        with:
          scan-args: |-
            --lockfile=package-lock.json
            --lockfile=client/package-lock.json
            --format=json
            --output-file=osv-results.json
        continue-on-error: true

      # A scan that errored writes no results file; fail instead of silently
      # reporting "no vulnerabilities found".
      - name: Check that the scan completed
        if: steps.scan.outcome == 'failure' && hashFiles('osv-results.json') == ''
        run: |
          echo "::error::OSV-Scanner failed without writing osv-results.json; see the 'Run OSV-Scanner' step for the cause."
          exit 1

      - name: Run OSV-Scanner (SARIF for code scanning)
        id: sarif
        if: hashFiles('osv-results.json') != ''
        uses: google/osv-scanner-action/osv-scanner-action@d3c1414ded37de590f207572e37a7d180f1d0ef7 # v2.7.1
        env:
          GOTOOLCHAIN: auto
        with:
          scan-args: |-
            --lockfile=package-lock.json
            --lockfile=client/package-lock.json
            --format=sarif
            --output-file=osv-results.sarif
        continue-on-error: true

      # Same guard as for the JSON scan: an operationally failed SARIF scan
      # writes no file and must not silently skip the Security tab upload
      # (vulnerability findings still write the file, so they pass this).
      - name: Check that the SARIF scan completed
        if: steps.sarif.outcome == 'failure' && hashFiles('osv-results.sarif') == ''
        run: |
          echo "::error::OSV-Scanner SARIF scan failed without writing osv-results.sarif; see the 'Run OSV-Scanner (SARIF for code scanning)' step for the cause."
          exit 1

      # Fails the job on HIGH/CRITICAL findings in production dependencies
      # (the production image is built with `npm ci --only=production`);
      # all findings are listed in the job summary.
      - name: Report OSV-Scanner findings
        if: hashFiles('osv-results.json') != ''
        run: node scripts/osv-report.mjs osv-results.json

      - name: Upload OSV-Scanner results to GitHub Security
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always() && hashFiles('osv-results.sarif') != ''
        # Pull requests from Dependabot or forks get a read-only token; the
        # findings are still in the job summary there.
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        with:
          sarif_file: osv-results.sarif
          category: 'osv-scanner'

  # ── Deep scans: CodeQL and Snyk only on main push, schedule or manual ────
  #    run; Trivy also on pull requests, so findings show up before merge.

  codeql:
    name: CodeQL Analysis
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      security-events: write

    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript, typescript
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:javascript-typescript"

  trivy:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write

    steps:
      - uses: actions/checkout@v7

      # Pinned to a commit: in March 2026 the trivy-action tags up to 0.34.2
      # were hijacked (GHSA-69fq-xp46-6x23) and the unprefixed tags deleted.
      # ed142fd = v0.36.0, a descendant of the verified safe v0.35.0 (57a97c7).
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          # .opencode holds tooling of the OpenCode coding agent and example/
          # sample apps; neither is part of the application or the client.
          skip-dirs: 'node_modules,client/node_modules,.git,.opencode,example'

      # Findings are uploaded to the Security tab; also list all of them in
      # the job summary and annotate the run (GitHub shows up to 10).
      - name: Report Trivy findings
        if: always() && hashFiles('trivy-results.sarif') != ''
        run: |
          count=$(jq '[.runs[].results[]] | length' trivy-results.sarif)
          {
            echo "### Trivy: $count finding(s) (CRITICAL/HIGH)"
            if [ "$count" -gt 0 ]; then
              echo
              echo "| Rule | File | Details |"
              echo "|---|---|---|"
              jq -r '.runs[].results[]
                | "| \(.ruleId) | \(.locations[0].physicalLocation.artifactLocation.uri) | \(.message.text | split("\n")[0] | gsub("\\|"; "/")) |"' \
                trivy-results.sarif
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          jq -r '.runs[].results[]
            | "::error file=\(.locations[0].physicalLocation.artifactLocation.uri)::\(.ruleId): \(.message.text | split("\n")[0])"' \
            trivy-results.sarif | head -n 10

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always() && hashFiles('trivy-results.sarif') != ''
        # Pull requests from Dependabot or forks get a read-only token; the
        # findings are still in the job summary there.
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy'

  snyk:
    name: Snyk Security Scan
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      security-events: write

    steps:
      - uses: actions/checkout@v7

      - name: Check Snyk token availability
        id: snyk_token
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -n "$SNYK_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      # Pinned CLI version, downloaded and checked against its SHA-256 by the
      # setup action (the snyk/actions/node image tag is mutable).
      - name: Install Snyk CLI
        if: steps.snyk_token.outputs.available == 'true'
        uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        with:
          snyk-version: v1.1307.4

      # Scans the server and the client package (from their lockfiles).
      # Fails on HIGH/CRITICAL findings that have a fix (upgrade or patch);
      # all findings go to the Security tab.
      - name: Run Snyk
        if: steps.snyk_token.outputs.available == 'true'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          set +e
          snyk test \
            --all-projects \
            --exclude=example,.opencode \
            --severity-threshold=high \
            --fail-on=upgradable \
            --sarif-file-output=snyk.sarif > snyk-output.txt 2>&1
          rc=$?
          set -e
          cat snyk-output.txt
          echo "::notice title=Snyk exit code::$rc"
          sed 's/\x1b\[[0-9;]*m//g' snyk-output.txt \
            | grep -E 'Tested |Target file|Organization|Open Source Security|issues|Upgrade|✗' \
            | head -n 8 | while IFS= read -r line; do echo "::notice title=Snyk::$line"; done
          exit $rc

      - name: Report Snyk findings
        if: always() && hashFiles('snyk.sarif') != ''
        run: |
          count=$(jq '[.runs[].results[]] | length' snyk.sarif)
          {
            echo "### Snyk: $count finding(s) (HIGH/CRITICAL)"
            if [ "$count" -gt 0 ]; then
              echo
              echo "| Rule | File | Details |"
              echo "|---|---|---|"
              jq -r '.runs[].results[]
                | "| \(.ruleId) | \(.locations[0].physicalLocation.artifactLocation.uri) | \(.message.text | split("\n")[0] | gsub("\\|"; "/")) |"' \
                snyk.sarif
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          jq -r '.runs[].results[]
            | "::error file=\(.locations[0].physicalLocation.artifactLocation.uri)::\(.ruleId): \(.message.text | split("\n")[0])"' \
            snyk.sarif | head -n 10

      - name: Upload Snyk results to GitHub Security
        if: always() && hashFiles('snyk.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: snyk.sarif
          category: snyk

      - name: Skip Snyk (no token configured)
        if: steps.snyk_token.outputs.available != 'true'
        run: echo "SNYK_TOKEN is not configured; skipping Snyk scan."
