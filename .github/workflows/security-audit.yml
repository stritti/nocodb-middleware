name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'  # Every Monday at 03:00 UTC
  # The deep scans below skip pull requests; this allows running them on a
  # branch, e.g. to verify a change to this workflow before merging.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Fast checks: run on every PR and push ────────────────────────────────
  npm-audit:
    name: npm Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run npm audit
        run: |
          npm audit --audit-level=high
        continue-on-error: true  # advisory only; fails the PR visibly

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: true

  # ── Deep scans: CodeQL and Snyk only on main push, schedule or manual ────
  #    run; Trivy also on pull requests, so findings show up before merge.
  codeql:
    name: CodeQL Analysis
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: javascript, typescript
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: "/language:javascript-typescript"

  trivy:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write

    steps:
      - uses: actions/checkout@v4

      # Pinned to a commit: in March 2026 the trivy-action tags up to 0.34.2
      # were hijacked (GHSA-69fq-xp46-6x23) and the unprefixed tags deleted.
      # ed142fd = v0.36.0, a descendant of the verified safe v0.35.0 (57a97c7).
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          # .opencode holds tooling of the OpenCode coding agent and example/
          # sample apps; neither is part of the application or the client.
          skip-dirs: 'node_modules,client/node_modules,.git,.opencode,example'

      # Findings are uploaded to the Security tab; also list all of them in
      # the job summary and annotate the run (GitHub shows up to 10).
      - name: Report Trivy findings
        if: always() && hashFiles('trivy-results.sarif') != ''
        run: |
          count=$(jq '[.runs[].results[]] | length' trivy-results.sarif)
          {
            echo "### Trivy: $count finding(s) (CRITICAL/HIGH)"
            if [ "$count" -gt 0 ]; then
              echo
              echo "| Rule | File | Details |"
              echo "|---|---|---|"
              jq -r '.runs[].results[]
                | "| \(.ruleId) | \(.locations[0].physicalLocation.artifactLocation.uri) | \(.message.text | split("\n")[0] | gsub("\\|"; "/")) |"' \
                trivy-results.sarif
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          jq -r '.runs[].results[]
            | "::error file=\(.locations[0].physicalLocation.artifactLocation.uri)::\(.ruleId): \(.message.text | split("\n")[0])"' \
            trivy-results.sarif | head -n 10

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        if: always() && hashFiles('trivy-results.sarif') != ''
        # Pull requests from Dependabot or forks get a read-only token; the
        # findings are still in the job summary there.
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy'

  snyk:
    name: Snyk Security Scan
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Check Snyk token availability
        id: snyk_token
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -n "$SNYK_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      # Pinned CLI version, downloaded and checked against its SHA-256 by the
      # setup action (the snyk/actions/node image tag is mutable).
      - name: Install Snyk CLI
        if: steps.snyk_token.outputs.available == 'true'
        uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        with:
          snyk-version: v1.1307.4

      # Scans the server and the client package (from their lockfiles).
      # Fails on HIGH/CRITICAL findings that have a fix (upgrade or patch);
      # all findings go to the Security tab.
      - name: Run Snyk
        if: steps.snyk_token.outputs.available == 'true'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: >-
          snyk test
          --all-projects
          --exclude=example,.opencode
          --severity-threshold=high
          --fail-on=upgradable
          --sarif-file-output=snyk.sarif

      - name: Upload Snyk results to GitHub Security
        if: always() && hashFiles('snyk.sarif') != ''
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: snyk.sarif
          category: snyk

      - name: Skip Snyk (no token configured)
        if: steps.snyk_token.outputs.available != 'true'
        run: echo "SNYK_TOKEN is not configured; skipping Snyk scan."
